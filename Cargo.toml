[package]
name = "tengu"
version = "0.2.0"
edition = "2021"
description = "Web quality auditor -- Performance, SEO, Accessibility, Best Practices"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "cookies", "gzip", "brotli", "json"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
thiserror = "2"
ego-tree = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json"] }

[features]
default = []
pg = ["sqlx/postgres", "sqlx/tls-rustls"]
