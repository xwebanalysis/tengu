services:
  tengu:
    build: .
    container_name: tengu
    restart: unless-stopped
    ports:
      - "8070:8070"
    environment:
      - PORT=8070
      - STATIC_DIR=/app/static/browser
      - TENGU_DB_PATH=/data/tengu.db
      - RUST_LOG=tengu=info,tower_http=info
      - TENGU_MAX_HISTORY=100
      - TENGU_RATE_LIMIT_PER_MINUTE=120
      - TENGU_RATE_LIMIT_BURST=30
      - TENGU_MAX_PAGES=50
      - TENGU_CRAWL_DEPTH=2
    volumes:
      - tengu_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8070' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tengu_data:
